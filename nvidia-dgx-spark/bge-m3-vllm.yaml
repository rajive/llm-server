recipe_version: "2"
model: BAAI/bge-m3
runtime: vllm
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

executor_config:
  entrypoint: ""

metadata:
  description: vLLM dense embedding service for BAAI/bge-m3 on a single DGX Spark
  model_params: 568M
  model_dtype: fp32

readiness:
  inference: false

defaults:
  port: 8001
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.1

command: |
  vllm serve {model} \
    --runner pooling \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --tensor-parallel-size {tensor_parallel}
