recipe_version: "2"
model: poolside/Laguna-S-2.1-NVFP4
runtime: vllm
min_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

executor_config:
  entrypoint: ""

metadata:
  description: Poolside Laguna S 2.1 NVFP4 with DFlash on DGX Spark, single-node or tensor-parallel cluster, using the Eugr vLLM nightly image
  model_params: 117.6B
  model_dtype: nvfp4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # The model supports 262144 tokens, but that needs about 18.64 GiB of KV cache.
  # Keep the single-Spark default modest. With two Sparks, try:
  # sparkrun run ./nvidia-dgx-spark/poolside-laguna-s-2.1-nvfp4-vllm.yaml --tp 2 --max-model-len 262144
  # Verify vLLM reports enough KV-cache memory at startup.
  max_model_len: 262144
  max_num_seqs: 32
  gpu_memory_utilization: 0.85
  speculative_config: '{"model":"poolside/Laguna-S-2.1-DFlash-NVFP4","num_speculative_tokens":7,"method":"dflash"}'

env:
  CUTE_DSL_ARCH: sm_121a
  MAX_JOBS: "4"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  NINJAFLAGS: "-j4"
  MAKEFLAGS: "-j4"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --speculative-config '{speculative_config}' \
    --default-chat-template-kwargs '{"enable_thinking":true}' \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1 \
    --max-num-seqs {max_num_seqs} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --no-enable-flashinfer-autotune \
    --tensor-parallel-size {tensor_parallel}
